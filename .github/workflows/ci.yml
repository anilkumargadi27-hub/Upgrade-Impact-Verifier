name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npm --workspace=@upgradelens/api run db:generate

      - name: Build all packages and applications
        run: npm run build

      - name: Run Vitest Unit & Integration Tests
        run: npm test

      - name: Evaluate 8 Fixture Scenarios (Real Pipeline)
        run: npm run evaluate:fixtures