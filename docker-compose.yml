version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: upgradelens-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: upgradelens
      POSTGRES_PASSWORD: upgradelens_dev_password
      POSTGRES_DB: upgradelens
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U upgradelens -d upgradelens"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: upgradelens-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: infra/Dockerfile.web
    container_name: upgradelens-api
    restart: unless-stopped
    ports:
      - "4000:4000"
    environment:
      NODE_ENV: production
      PORT: 4000
      DATABASE_URL: postgresql://upgradelens:upgradelens_dev_password@postgres:5432/upgradelens?schema=public
      REDIS_URL: redis://redis:6379
      SESSION_SECRET: dev_super_secret_session_key_min_32_chars_long
      CORS_ORIGIN: http://localhost:4000
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker:
    build:
      context: .
      dockerfile: infra/Dockerfile.worker
    container_name: upgradelens-worker
    restart: unless-stopped
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://upgradelens:upgradelens_dev_password@postgres:5432/upgradelens?schema=public
      REDIS_URL: redis://redis:6379
      RUNNER_TYPE: process
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  postgres_data:
  redis_data: