services:
  # Standalone Unified Web Service (Express REST API + React SPA + Embedded Database)
  - type: web
    name: upgradelens-web
    runtime: node
    plan: free
    region: oregon
    buildCommand: npm ci --include=dev && npm --workspace=@upgradelens/api run db:push && npm run build
    startCommand: node --max-old-space-size=128 apps/api/dist/index.js
    healthCheckPath: /api/healthz
    envVars:
      - key: NODE_VERSION
        value: 22.12.0
      - key: PORT
        value: 10000
      - key: DATABASE_URL
        value: "file:/tmp/upgradelens.db"
      - key: SESSION_SECRET
        generateValue: true
      - key: RUNNER_TYPE
        value: process
      - key: AI_ENABLED
        value: "false"
