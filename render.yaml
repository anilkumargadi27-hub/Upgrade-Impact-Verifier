services:
  # Standalone Unified Web Service (Express REST API + React SPA + Embedded PGlite Database)
  - type: web
    name: upgradelens-web
    runtime: node
    plan: free
    region: oregon
    buildCommand: npm ci && npm --workspace=@upgradelens/api run db:generate && npm run build
    startCommand: npm --workspace=@upgradelens/api start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: SESSION_SECRET
        generateValue: true
      - key: RUNNER_TYPE
        value: process
      - key: AI_ENABLED
        value: "false"